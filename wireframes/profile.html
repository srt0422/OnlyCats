<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Profile - CatApp</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <!-- Header -->
  <nav class="navbar navbar-expand-lg navbar-light bg-light">
    <div class="container">
      <a class="navbar-brand" href="#">CatApp</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavProfile">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNavProfile">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="home.html">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="past-contests.html">Past Contests</a></li>
          <li class="nav-item"><a class="nav-link active" href="profile.html">Profile</a></li>
        </ul>
      </div>
    </div>
  </nav>
  
  <!-- Main Content: Profile Details -->
  <div class="container my-4">
    <div class="row">
      <!-- Sidebar: Profile Picture and Name -->
      <div class="col-md-3 text-center">
        <img src="https://via.placeholder.com/150?text=Profile+Pic" class="rounded-circle img-fluid" alt="Profile Picture">
        <h4 class="mt-2">User Name</h4>
      </div>
      <!-- Profile Info -->
      <div class="col-md-9">
        <h2>Account Information</h2>
        <p>Email: user@example.com</p>
        <button class="btn btn-secondary mb-3">Edit Profile</button>
        <hr>
        <h3>Favorites</h3>
        <div class="row">
          <div class="col-md-4 mb-3">
            <img src="https://via.placeholder.com/300x200?text=Favorite+Cat+1" class="img-fluid" alt="Favorite Cat 1">
          </div>
          <div class="col-md-4 mb-3">
            <img src="https://via.placeholder.com/300x200?text=Favorite+Cat+2" class="img-fluid" alt="Favorite Cat 2">
          </div>
          <div class="col-md-4 mb-3">
            <img src="https://via.placeholder.com/300x200?text=Favorite+Cat+3" class="img-fluid" alt="Favorite Cat 3">
          </div>
        </div>
      </div>
    </div>
  </div>
  
  <!-- Footer -->
  <footer class="bg-light text-center py-3">
    <div class="container">
      <p>&copy; 2025 CatApp. All rights reserved.</p>
    </div>
  </footer>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
